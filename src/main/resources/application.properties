spring.application.name=tiendawebapp

# ===========================================
# CONFIGURACIÓN MYSQL (Base de Datos Principal)
# ===========================================
spring.datasource.url=jdbc:mysql://localhost:3306/tiendawebapp?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate para MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# CONFIGURACIÓN MONGODB (Analytics Storage)
# ===========================================
# MongoDB Connection (Local)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=tiendawebapp_analytics

# ===========================================
# CONFIGURACIÓN REDIS (Session & Cache)
# ===========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# ===========================================
# CONFIGURACIÓN SERVIDOR
# ===========================================
server.port=8080

# ===========================================
# CONFIGURACIÓN LOGGING
# ===========================================
logging.level.com.spring.tiendaweb=DEBUG
logging.level.org.springframework.data.mongodb=INFO

