<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - FITCROWS</title>
    <link rel="stylesheet" href="/stylelogin.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <!-- Sección izquierda: Animación de palabras -->
        <div class="words-section">
            <div class="animated-word-container">
                <h2 class="animated-word" id="animatedWord">ESTILO</h2>
            </div>
            <div class="tagline">
                <p>VISTE CON LA FUERZA QUE MÁS TE DEFINE</p>
            </div>
        </div>

        <!-- Sección derecha: Formulario de login -->
        <div class="form-section">
            <div class="formulario">
                <h1>Inicio de sesión</h1>

                <!-- Mensajes de éxito y error -->
                <div th:if="${success}" class="mensaje-exito">
                    <p th:text="${success}"></p>
                </div>
                
                <div th:if="${error}" class="mensaje-error">
                    <p th:text="${error}"></p>
                </div>

                <form method="post" action="/Login">
                    <div class="campo-entrada">
                        <input type="text" name="username" required>
                        <label>Nombre de usuario</label>
                        <span></span>
                    </div>
                    
                    <div class="campo-entrada">
                        <input type="password" name="password" required>
                        <label>Contraseña</label>
                        <span></span>
                    </div>
                    
                    <a href="#" class="recordar">¿Olvidó su contraseña?</a>
                    
                    <input type="submit" value="Iniciar Sesión">
                    
                    <div class="registrarse">
                        ¿No tienes cuenta? <a href="#" onclick="openRegister(event)">Regístrate aquí</a>
                    </div>        
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Registro -->
    <div id="registerModal" class="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center;">
        <div style="background:#fff; padding:24px; border-radius:12px; width:340px; position:relative; box-shadow:0 10px 40px rgba(0,0,0,0.2);">
            <button style="position:absolute; top:8px; right:10px; border:none; background:transparent; font-size:20px; cursor:pointer;" onclick="closeRegister()">×</button>
            <h2 style="margin-bottom:12px;">Crear cuenta</h2>
            <form id="registerForm" onsubmit="submitRegister(event)">
                <div class="campo-entrada">
                    <input type="text" name="nombre" required>
                    <label>Nombre</label><span></span>
                </div>
                <div class="campo-entrada">
                    <input type="text" name="segundoNombre" placeholder="Segundo nombre (opcional)">
                    <label style="opacity:0.6;">Segundo nombre</label><span></span>
                </div>
                <div class="campo-entrada">
                    <input type="email" name="email" required>
                    <label>Email</label><span></span>
                </div>
                <div class="campo-entrada">
                    <input type="text" name="usuario" required>
                    <label>Usuario</label><span></span>
                </div>
                <div class="campo-entrada">
                    <input type="password" name="password" required>
                    <label>Contraseña</label><span></span>
                </div>
                <button type="submit" style="width:100%; padding:10px; margin-top:10px; background:#111; color:#fff; border:none; border-radius:8px; cursor:pointer;">Registrar</button>
            </form>
            <div id="registerMsg" style="margin-top:10px; font-weight:600;"></div>
        </div>
    </div>

    <!-- JavaScript para la animación de palabras -->
    <script>
        // Arreglo de palabras y animación suave
        const words = ["ESTILO", "CONFORT", "CALIDAD", "FUERZA"];
        let currentWordIndex = 0;
        const animatedWordElement = document.getElementById('animatedWord');

        function changeWord() {
            // Desvanecimiento suave (fade out)
            animatedWordElement.style.opacity = '0';
            
            setTimeout(() => {
                // Cambiar la palabra
                currentWordIndex = (currentWordIndex + 1) % words.length;
                animatedWordElement.textContent = words[currentWordIndex];
                
                // Aparición suave (fade in)
                animatedWordElement.style.opacity = '1';
            }, 500); // Medio segundo para el cambio
        }

        // Cambiar palabra cada 3 segundos
        setInterval(changeWord, 3000);

        function openRegister(e){ e.preventDefault(); document.getElementById('registerModal').style.display='flex'; }
        function closeRegister(){ document.getElementById('registerModal').style.display='none'; document.getElementById('registerMsg').textContent=''; }

        async function submitRegister(e){
            e.preventDefault();
            const form = document.getElementById('registerForm');
            const data = Object.fromEntries(new FormData(form).entries());
            try{
                const resp = await fetch('/register', {
                    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)
                });
                const text = await resp.text();
                const msgEl = document.getElementById('registerMsg');
                if(resp.ok){
                    msgEl.style.color = 'green';
                    msgEl.textContent = text || 'Registro exitoso';
                    form.reset();
                } else {
                    msgEl.style.color = 'red';
                    msgEl.textContent = text || 'No se pudo registrar';
                }
            } catch(err){
                document.getElementById('registerMsg').style.color='red';
                document.getElementById('registerMsg').textContent='Error al registrar';
            }
        }
    </script>
</body>
</html>
