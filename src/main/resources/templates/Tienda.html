<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda - FitCrows</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background: linear-gradient(135deg, #000 0%, #333 100%);
            color: white;
            padding: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }

        .container-main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            gap: 30px;
        }

        /* MENÚ VERTICAL */
        .sidebar {
            width: 220px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar h3 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #000;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }

        .category-list {
            list-style: none;
        }

        .category-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            background-color: #f0f0f0;
            border-left: 3px solid transparent;
            font-weight: 500;
        }

        .category-item:hover {
            background-color: #e0e0e0;
            border-left-color: #000;
        }

        .category-item.active {
            background-color: #000;
            color: white;
            border-left-color: white;
        }

        /* CONTENIDO PRINCIPAL */
        .main-content {
            flex: 1;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .product-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #e0e0e0 0%, #f0f0f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: #000;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 20px;
            font-weight: bold;
            color: #000;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 0;
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #000 0%, #333 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 30px;
        }

        .modal-product-image {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, #e0e0e0 0%, #f0f0f0 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .modal-product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-details {
            margin-bottom: 20px;
        }

        .product-details h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #000;
        }

        .product-price-modal {
            font-size: 28px;
            font-weight: bold;
            color: #000;
            margin-bottom: 15px;
        }

        .product-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .comments-section {
            margin-top: 30px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .comments-section h4 {
            margin-bottom: 15px;
            color: #000;
        }

        .comment-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 3px solid #000;
        }

        .comment-author {
            font-weight: 600;
            color: #000;
            font-size: 13px;
        }

        .comment-text {
            color: #666;
            font-size: 13px;
            margin-top: 5px;
        }

        .comment-form {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .comment-form input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }

        .comment-form button {
            padding: 10px 20px;
            background: #000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .comment-form button:hover {
            background: #333;
        }

        .no-products {
            grid-column: 1 / -1;
            padding: 40px;
            text-align: center;
            color: #999;
            font-size: 18px;
        }

        .rating {
            display: flex;
            gap: 3px;
            margin-bottom: 15px;
        }

        .star {
            color: #ffc107;
            font-size: 18px;
        }
    </style>
</head>

        let currentCategory = 'all';
        let currentProduct = null;
        const comentariosLocales = {};

        // Inicializar comentarios locales
        productos.forEach(p => {
            comentariosLocales[p.id] = [...p.comentarios];
        });

        // Renderizar productos inicialmente
        function renderProducts(category) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            let filtered = productos;
            if (category !== 'all') {
                filtered = productos.filter(p => p.categoria === category);
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-products">No hay productos en esta categoría</div>';
                return;
            }

            filtered.forEach(producto => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image">
                        <img src="${producto.imagen}" alt="${producto.nombre}" onerror="this.src='https://via.placeholder.com/250x250?text=Sin+imagen'">
                    </div>
                    <div class="product-info">
                        <div class="product-name">${producto.nombre}</div>
                        <div class="product-price">$${producto.precio.toLocaleString('es-CO')}</div>
                    </div>
                `;
                card.onclick = () => openModal(producto);
                grid.appendChild(card);
            });
        }

        // Abrir modal
        function openModal(producto) {
            const modal = document.getElementById('productModal');
            document.getElementById('modalProductName').textContent = producto.nombre;
            document.getElementById('modalProductPrice').textContent = `$${producto.precio.toLocaleString('es-CO')}`;
            document.getElementById('modalProductDescription').textContent = producto.descripcion;
            document.querySelector('.modal-product-image img').src = producto.imagen;
            document.getElementById('qtyInput').value = 1;

            currentProduct = producto;

            // Renderizar comentarios
            renderComments(producto.id);

            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
            window.currentProductId = producto.id;
        }

        // Cerrar modal
        function closeModal() {
            const modal = document.getElementById('productModal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Renderizar comentarios
        function renderComments(productId) {
            const commentsList = document.getElementById('commentsList');
            const comments = comentariosLocales[productId] || [];

            if (comments.length === 0) {
                commentsList.innerHTML = '<p style="color: #999;">No hay comentarios aún. ¡Sé el primero!</p>';
                return;
            }

            commentsList.innerHTML = comments.map(comment => `
                <div class="comment-item">
                    <div class="comment-author">${comment.autor}</div>
                    <div class="comment-text">${comment.texto}</div>
                </div>
            `).join('');
        }

        // Agregar comentario
        function addComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();

            if (text === '') {
                alert('Por favor escribe un comentario');
                return;
            }

            const productId = window.currentProductId;
            if (!comentariosLocales[productId]) {
                comentariosLocales[productId] = [];
            }

            comentariosLocales[productId].push({
                autor: 'Usuario Anónimo',
                texto: text
            });

            input.value = '';
            renderComments(productId);
        }

        // Event listeners para categorías
        document.querySelectorAll('.category-item').forEach(item => {
            item.addEventListener('click', function() {
                // Remover clase active
                document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
                // Añadir clase active al clickeado
                this.classList.add('active');
                // Renderizar productos
                currentCategory = this.getAttribute('data-category');
                renderProducts(currentCategory);
            });
        });

        // Cerrar modal si se hace click afuera
        window.onclick = function(event) {
            const modal = document.getElementById('productModal');
            if (event.target == modal) {
                closeModal();
            }
        };

        // Renderizar inicialmente
        renderProducts('all');

        async function pagarProducto() {
            if (!currentProduct) return;
            const qty = parseInt(document.getElementById('qtyInput').value) || 1;
            const payload = {
                nombre: currentProduct.nombre,
                precio: currentProduct.precio,
                categoria: currentProduct.categoria,
                cantidad: qty,
                imagen: currentProduct.imagen
            };
            try {
                const resp = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                // ✅ Si retorna 401, significa que no hay sesión
                if (resp.status === 401) {
                    alert('Por favor, inicia sesión para comprar');
                    window.location.href = '/Login';
                    return;
                }
                
                if (!resp.ok) {
                    const errorMsg = await resp.text();
                    throw new Error(errorMsg || 'Error al procesar el pago');
                }
                
                const successMsg = await resp.text();
                alert(successMsg || 'Pago exitoso');
                closeModal();
            } catch (err) {
                console.error(err);
                alert(err.message || 'No se pudo completar el pago');
            }
        }
    </script>
</body>
</html>
